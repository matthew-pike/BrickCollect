# One-off test (branch lego-price-test only): can GitHub's servers read prices from LEGO.com? Delete the branch after.
name: LEGO price test
on:
  push:
    branches: [lego-price-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/lego-price-test.mjs
