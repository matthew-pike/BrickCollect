[build]
  publish = "public"

# The Supabase project address is public by design (it's in public/config.js so browsers can reach it),
# so the secrets scan shouldn't treat it as a secret. Every real secret key is still checked.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The catalog is large but changes rarely: browsers keep a copy and check it's still current on each visit
# (a quick "not modified" answer when it is), so a catalog update shows up straight away.
[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
